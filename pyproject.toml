[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grape"
version = "0.1.0"
description = "GRAPE: Graph-Augmented Prototype Explanations for Interactive Medical Image Diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Rasul Khanbayov" },
    { name = "Hasan Kurban" },
]
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers>=4.40,<5.0",
    "scikit-learn>=1.3",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "pillow>=9.5",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["src"]
